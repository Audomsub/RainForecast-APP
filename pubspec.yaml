name: rainforecast_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_map:
  flutter_login: ^5.0.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  go_router: ^17.0.1
  http: ^1.2.0
  geocoding: ^3.0.0
  shared_preferences: ^2.5.4
  path: ^1.9.0
  sqflite: ^2.3.0
  supabase_flutter: ^2.3.4
  sqflite_common_ffi: ^2.3.0
  crypto: ^3.0.3
  fl_chart: ^0.70.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"